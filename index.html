<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Frida Scripts Archive</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --special-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .search-box {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: #fff;
            margin-bottom: 2rem;
            box-sizing: border-box;
        }

        .search-box:focus {
            outline: 2px solid var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card.special {
            border-color: var(--special-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .version-badge {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .special .version-badge {
            background-color: var(--special-color);
            color: #000;
        }

        .script-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .script-item {
            font-family: monospace;
            font-size: 0.85rem;
            padding: 0.3rem 0;
            color: var(--text-muted);
            word-break: break-all;
        }

        .script-item:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Brawl Stars Frida Scripts</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Script adı veya sürüm ara (örn: v59, deobf, turkstars)..." onkeyup="filterScripts()">

    <div class="grid" id="scriptGrid"></div>
</div>

<script>

        isSpecial: true,
        files: [

            "special/deobf-spk-v59.js", "special/libBSRE-v57-deobf.script.js", 
            "special/libformodders-v59.js", "special/libgene-v54.script.js", 
            "special/ts-v56-64bit.js", "special/turkstars-v55.js"
        ]
    },
    { version: "v11", files: ["libcorescript.js"] },

    { version: "v13", files: ["BrownStars_13.181.js", "magicsbrawl-old.js", "magicsbrawl_v13.js", "v13 online battle.js", "v13-crypto.js"] },
    { version: "v15", files: ["libmrvitalik.script.js", "v15 nost.js", "v15.js"] },
    { version: "v18", files: ["V18.js", "libleak.js", "nost_v18.js", "nostrecovered.js", "v18-debug.js", "v18debugmenu.js"] },
    { version: "v19", files: ["V19.111.1.js", "v19 grape.js"] },
    { version: "v20", files: ["Armored-Brawl-20.js", "v20.93.js"] },
    { version: "v22", files: ["debug22test.js", "vbcv22deobf.js"] },
    { version: "v24", files: ["tailerbrawl-v24.js", "v24.150.js", "v24.js"] },
    { version: "v25", files: ["v25.107.js", "v25sc.js"] },
    { version: "v26", files: ["fhxbrawlv26.js", "libcb.script.js", "niki26.js", "script.js"] },
    { version: "v27", files: ["alahv27.269.js", "kubune.js", "libgg.script27.269.1.js", "libreversed.script.js", "v27.269.js", "v27.js"] },
    { version: "v28", files: ["idk.js", "v28.189.js", "v28.189debugnig.js", "v28.189libgroot.js"] },
    { version: "v29", files: ["29libsctest.js", "LwitchyV29.js", "archbrawl.js", "libcat.js", "libsctest2.js", "libsigma-deobf.js", "steelbrawl.js", "v29_debug.js", "v29.js"] },
    { version: "v30", files: ["v30.125.js"] },

    { version: "v52", files: ["v52.177.js", "v52script.js"] },
    { version: "v53", files: ["bsl_v53.js", "v53script.js"] },

    { version: "v55", files: ["55.js", "lobbyinfo55.js", "lombmods.js", "turkstars-v55.js"] },
    { version: "v56", files: ["ts-old-v56-32bit.js", "ts-old-v56-64bit.js", "ts-v56-32bit.js", "ts-v56-64bit.js", "v56.274.js"] },
    { version: "v57", files: ["libBSRE-v57-deobf.script.js", "v57.js"] },
    { version: "v58", files: ["SupercellSWFdumper-ios.js"] },
    { version: "v59", files: ["BS+V59.js", "BSVL-V59.js", "button59.197.js", "bypassLouSlipperyDebuff-v59.js", "deobf-spk-2-v59.js", "deobf-spk-v59.js", "kitcheat.js", "kitmovelikegenejustwithcoordinates.js", "libformodders-v59.js", "v59.197.js", "xray.js"] }
];

function renderGrid(data) {
    const grid = document.getElementById('scriptGrid');
    grid.innerHTML = '';

    data.forEach(group => {
        const isSpecial = group.isSpecial;
        const title = isSpecial ? group.category : group.version.toUpperCase();
        
        const card = document.createElement('div');
        card.className = `card ${isSpecial ? 'special' : ''}`;
        
        const fileList = group.files.map(f => `<li class="script-item">${f}</li>`).join('');

        card.innerHTML = `
            <div class="card-header">
                <span class="version-badge">${title}</span>
                <small style="color: var(--text-muted);">${group.files.length} Dosya</small>
            </div>
            <ul class="script-list">
                ${fileList}
            </ul>
        `;
        grid.appendChild(card);
    });
}

function filterScripts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = scriptsData.map(group => {
        const matchedFiles = group.files.filter(f => 
            f.toLowerCase().includes(query) || 
            (group.version && group.version.toLowerCase().includes(query))
        );
        return { ...group, files: matchedFiles };
    }).filter(group => group.files.length > 0);

    renderGrid(filtered);
}

renderGrid(scriptsData);
</script>

</body>
</html>
